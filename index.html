<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10142a">
  <title>Órbita — Quiz de exploración espacial</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #10142a;
      --surface: #191f3b;
      --surface-raised: #202849;
      --text: #f6f7ff;
      --muted: #aab2d2;
      --line: #303a60;
      --accent: #a99bff;
      --accent-strong: #7865f5;
      --good: #43d9a3;
      --good-bg: #123b37;
      --bad: #ff7185;
      --bad-bg: #482535;
      --shadow: 0 24px 70px rgb(3 7 24 / 35%);
      --star: rgb(198 190 255 / 48%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f3f4fb;
        --surface: #fff;
        --surface-raised: #f5f6ff;
        --text: #202442;
        --muted: #69708d;
        --line: #e1e4f1;
        --accent: #6957df;
        --accent-strong: #5845d0;
        --good: #087d5b;
        --good-bg: #e0f7ee;
        --bad: #c63856;
        --bad-bg: #ffebef;
        --shadow: 0 24px 70px rgb(48 54 93 / 12%);
        --star: rgb(89 83 170 / 30%);
      }
    }

    * { box-sizing: border-box; }

    body {
      isolation: isolate;
      min-height: 100vh;
      margin: 0;
      padding: 44px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(120 101 245 / 15%), transparent 48%),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 19%, var(--star) 50%, transparent 100%),
        radial-gradient(1px 1px at 31% 72%, var(--star) 50%, transparent 100%),
        radial-gradient(2px 2px at 78% 24%, var(--star) 50%, transparent 100%),
        radial-gradient(1px 1px at 91% 63%, var(--star) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 64% 88%, var(--star) 50%, transparent 100%),
        radial-gradient(1px 1px at 44% 38%, var(--star) 50%, transparent 100%);
      background-size: 317px 283px, 251px 347px, 389px 311px, 293px 421px, 433px 373px, 359px 257px;
      content: "";
      opacity: .52;
      pointer-events: none;
      animation: star-drift 90s linear infinite;
    }
    body > * { position: relative; z-index: 1; }

    .shell { width: min(100%, 520px); }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .brand-mark { font-size: 18px; }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card-inner { padding: 30px; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .score-pill {
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--text);
      white-space: nowrap;
    }
    .score-pill strong { color: var(--accent); }
    .progress-track {
      height: 8px;
      margin-bottom: 29px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-raised);
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7e70ff, #c298ff);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    h1, h2 { margin: 0; letter-spacing: -.035em; line-height: 1.2; }
    h1 { font-size: clamp(23px, 5vw, 29px); }
    .intro { margin: 12px 0 23px; color: var(--muted); }
    .question {
      position: relative;
      min-height: 0;
      margin: 0 0 20px;
      padding: 23px 21px 22px 24px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 7px 16px 16px 7px;
      background:
        radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 54%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 4%, transparent) 25%, transparent 25%) 0 0 / 12px 12px,
        var(--surface-raised);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 4%, transparent), 0 8px 22px rgb(5 10 35 / 8%);
      font-size: 20px;
      font-weight: 740;
      line-height: 1.4;
      letter-spacing: -.02em;
    }
    .question::before {
      position: absolute;
      top: 13px;
      right: 14px;
      width: 7px;
      height: 7px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
      content: "";
    }
    .answers { display: grid; gap: 10px; }
    .answer {
      width: 100%;
      min-height: 54px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-raised);
      color: var(--text);
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
    }
    .answer:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 5px 20px rgb(120 101 245 / 13%);
    }
    .answer:focus-visible, .restart:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .answer:disabled { cursor: default; }
    .choice-key {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .answer.correct {
      border-color: var(--good);
      background: var(--good-bg);
      animation: pop .35s ease both;
    }
    .answer.correct .choice-key { border-color: var(--good); color: var(--good); }
    .answer.incorrect {
      border-color: var(--bad);
      background: var(--bad-bg);
      animation: shake .38s ease both;
    }
    .answer.incorrect .choice-key { border-color: var(--bad); color: var(--bad); }
    .answer.reveal-correct { border-color: var(--good); background: var(--good-bg); }
    .answer.reveal-correct .choice-key { border-color: var(--good); color: var(--good); }
    .feedback {
      min-height: 28px;
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .footer {
      padding: 16px 30px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .results { padding: 36px 30px 34px; text-align: center; animation: appear .5s ease both; }
    .result-emoji { display: block; margin: 1px 0 13px; font-size: 62px; animation: float .9s ease-in-out infinite alternate; }
    .results h2 { font-size: 27px; }
    .result-score { margin: 12px 0 5px; color: var(--accent); font-size: 42px; font-weight: 850; letter-spacing: -.05em; }
    .result-copy { max-width: 350px; margin: 0 auto 22px; color: var(--muted); }
    .restart {
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent-strong);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s, filter .18s;
    }
    .restart:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .hidden { display: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
    @keyframes pop {
      0% { transform: scale(.98); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { to { transform: translateY(-6px) rotate(4deg); } }
    @keyframes star-drift { to { transform: rotate(360deg) scale(1.08); } }
    @media (max-width: 480px) {
      body { padding: 25px 14px; }
      .card-inner { padding: 24px 20px; }
      .footer { padding-inline: 20px; }
      .question { min-height: 0; font-size: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Órbita · exploración espacial</div>
    <section class="card" aria-label="Cuestionario de exploración espacial">
      <div id="quiz" class="card-inner">
        <div class="topline">
          <span id="counter">Pregunta 1 de 10</span>
          <span class="score-pill">Puntos <strong id="score">0</strong></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div id="progress" class="progress-fill"></div>
        </div>
        <p class="eyebrow">Misión de conocimiento</p>
        <h1 class="sr-only">Quiz de exploración espacial</h1>
        <p id="question" class="question"></p>
        <div id="answers" class="answers" role="group" aria-label="Opciones de respuesta"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>
      <div id="results" class="results hidden" aria-live="polite"></div>
      <div id="card-footer" class="footer">10 preguntas · Una pequeña vuelta por el universo</div>
    </section>
  </main>

  <script>
    const questions = [
      { question: "¿Cuál fue el primer satélite artificial puesto en órbita?", answers: ["Explorer 1", "Sputnik 1", "Vostok 1", "Luna 2"], correct: 1, fact: "Sputnik 1 fue lanzado por la Unión Soviética en 1957." },
      { question: "¿Qué planeta visitó primero una nave espacial?", answers: ["Marte", "Venus", "Júpiter", "Mercurio"], correct: 1, fact: "Mariner 2 sobrevoló Venus en 1962: fue la primera visita a otro planeta." },
      { question: "¿Cómo se llamó la primera persona que viajó al espacio?", answers: ["Neil Armstrong", "John Glenn", "Yuri Gagarin", "Alan Shepard"], correct: 2, fact: "Yuri Gagarin completó una órbita terrestre en 1961." },
      { question: "¿Qué misión llevó a los primeros humanos a la Luna?", answers: ["Apollo 8", "Apollo 11", "Gemini 7", "Apollo 13"], correct: 1, fact: "Apollo 11 alunizó el 20 de julio de 1969." },
      { question: "¿Cuál es el nombre del rover que explora Marte desde 2021?", answers: ["Curiosity", "Spirit", "Perseverance", "Sojourner"], correct: 2, fact: "Perseverance aterrizó en el cráter Jezero en febrero de 2021." },
      { question: "¿Qué telescopio espacial fue lanzado en 2021?", answers: ["Hubble", "Kepler", "Chandra", "James Webb"], correct: 3, fact: "El telescopio James Webb observa el universo principalmente en infrarrojo." },
      { question: "¿En qué planeta se encuentra Olympus Mons, el mayor volcán conocido?", answers: ["Venus", "Marte", "Tierra", "Io"], correct: 1, fact: "Olympus Mons se eleva unos 22 kilómetros sobre la superficie marciana." },
      { question: "¿Qué sonda fue la primera en alcanzar el espacio interestelar?", answers: ["Pioneer 10", "Voyager 1", "New Horizons", "Cassini"], correct: 1, fact: "Voyager 1 cruzó la heliopausa en 2012." },
      { question: "¿Cuál es la luna más grande de Saturno?", answers: ["Europa", "Fobos", "Titán", "Ganímedes"], correct: 2, fact: "Titán tiene una atmósfera densa y lagos de metano y etano." },
      { question: "¿Qué fenómeno ayuda a una nave a ganar velocidad usando un planeta?", answers: ["Eclipse gravitatorio", "Asistencia gravitatoria", "Viento solar", "Resonancia óptica"], correct: 1, fact: "La asistencia gravitatoria aprovecha el movimiento de un planeta para cambiar la velocidad y trayectoria de una nave." }
    ];

    let current = 0;
    let score = 0;
    let locked = false;
    const questionEl = document.querySelector("#question");
    const answersEl = document.querySelector("#answers");
    const feedbackEl = document.querySelector("#feedback");
    const progressEl = document.querySelector("#progress");
    const progressTrack = document.querySelector(".progress-track");

    function renderQuestion() {
      locked = false;
      const item = questions[current];
      document.querySelector("#counter").textContent = `Pregunta ${current + 1} de ${questions.length}`;
      document.querySelector("#score").textContent = score;
      questionEl.textContent = item.question;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      answersEl.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="choice-key">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index, button));
        answersEl.append(button);
      });
      const completed = current;
      progressEl.style.width = `${(completed / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", completed);
    }

    function chooseAnswer(index, selected) {
      if (locked) return;
      locked = true;
      const item = questions[current];
      const correct = index === item.correct;
      if (correct) score += 1;
      document.querySelector("#score").textContent = score;
      selected.classList.add(correct ? "correct" : "incorrect");
      if (!correct) answersEl.children[item.correct].classList.add("reveal-correct");
      [...answersEl.children].forEach(button => { button.disabled = true; });
      feedbackEl.textContent = `${correct ? "¡Correcto!" : "No exactamente."} ${item.fact}`;
      feedbackEl.classList.add(correct ? "good" : "bad");
      progressEl.style.width = `${((current + 1) / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", current + 1);
      window.setTimeout(() => {
        current += 1;
        if (current === questions.length) showResults();
        else renderQuestion();
      }, 1500);
    }

    function showResults() {
      document.querySelector("#quiz").classList.add("hidden");
      const results = document.querySelector("#results");
      const reaction = score === 10 ? "🏆" : score >= 7 ? "🚀" : score >= 4 ? "🌟" : "🪐";
      const title = score === 10 ? "¡Misión perfecta!" : score >= 7 ? "¡Gran exploración!" : score >= 4 ? "¡Buen viaje espacial!" : "¡A seguir explorando!";
      const message = score === 10 ? "Has conquistado el cosmos. ¡Ni un solo error!" :
        score >= 7 ? "Tienes madera de astronauta. El universo te sienta bien." :
        score >= 4 ? "Vas por buen camino: cada dato te acerca a las estrellas." :
        "Toda gran misión empieza con curiosidad. ¡Despega otra vez!";
      results.innerHTML = `<span class="result-emoji" aria-hidden="true">${reaction}</span><p class="eyebrow">Misión completada</p><h2>${title}</h2><p class="result-score">${score}<span style="font-size:20px;color:var(--muted)"> / ${questions.length}</span></p><p class="result-copy">${message}</p><button class="restart" type="button">Volver a intentarlo</button>`;
      results.classList.remove("hidden");
      results.querySelector(".restart").addEventListener("click", restart);
      document.querySelector("#card-footer").textContent = "Gracias por explorar con Órbita";
    }

    function restart() {
      current = 0;
      score = 0;
      document.querySelector("#quiz").classList.remove("hidden");
      const results = document.querySelector("#results");
      results.classList.add("hidden");
      results.replaceChildren();
      document.querySelector("#card-footer").textContent = "10 preguntas · Una pequeña vuelta por el universo";
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
